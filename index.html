<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <script>
        (function() {
            // 1. Check for cookie
            function getCookie(name) {
                let match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
                if (match) return match[2];
            }

            const langCookie = getCookie('racaille_lang');

            if (langCookie) {
                // If cookie exists, redirect to that language
                if (['US', 'ES', 'JP'].includes(langCookie)) {
                    window.location.replace('/' + langCookie + '/');
                    return;
                }
            }

            // 2. If no cookie, check browser language
            const browserLang = navigator.language || navigator.userLanguage;
            // e.g., "en-US", "es-ES", "ja"

            if (browserLang.startsWith('es')) {
                window.location.replace('/ES/');
            } else if (browserLang.startsWith('ja')) {
                window.location.replace('/JP/');
            } else {
                // Default to US (English)
                window.location.replace('/US/');
            }
        })();
    </script>
</head>
<body>
</body>
</html>
